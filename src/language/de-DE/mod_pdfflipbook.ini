MOD_PDFFLIPBOOK_FIELD_COLORMODULE_DESC="Verwendet die Akzentfarbe für den Rahmen der Vorschaubilder und die Buttons des Moduls. Ausschalten, um das Modul komplett über das Template-CSS zu gestalten (Variablen --pfb-accent und --pfb-accent-dark)."
MOD_PDFFLIPBOOK_FIELD_FLIP_LABEL="Dauer des Umblätterns (ms)"
MOD_PDFFLIPBOOK_FIELD_FLIP_DESC="Dauer der Umblätter-Animation in Millisekunden (100–3000, Standard 800)."
MOD_PDFFLIPBOOK_NOTICE_NO_FOLDER="PDF Flipbook Catalogs: Der Ordner <code>%s</code> existiert nicht. Bitte die Einstellung „Katalog-Ordner“ prüfen. (Nur für Administratoren sichtbar.)"
MOD_PDFFLIPBOOK_NOTICE_NO_FILES="PDF Flipbook Catalogs: Keine PDF-Dateien in <code>%s</code> gefunden. Das Modul ist auf mehrsprachige Seiten ausgelegt: Je Sprache einen Unterordner mit dem Sprachkürzel anlegen (z. B. <code>de</code>, <code>en</code>) und die PDFs dort ablegen. Bei einsprachigen Seiten können die PDFs auch direkt im Ordner liegen, solange es keine Sprach-Unterordner gibt. (Nur für Administratoren sichtbar.)"
MOD_PDFFLIPBOOK_FIELD_PROTECT_LABEL="Dateien schützen"
MOD_PDFFLIPBOOK_FIELD_PROTECT_DESC="Nur Besucher, die dieses Modul sehen dürfen (Reiter „Modul“ → Zugriffsebene, z. B. „Registriert“), können die PDFs öffnen. Direkte Links auf die Dateien funktionieren nicht mehr: Das Modul sperrt den Ordner mit einer .htaccess-Datei, und Joomla liefert PDFs und Vorschaubilder erst nach Prüfung der Zugriffsebene aus. Für geschützte Kataloge einen eigenen Ordner verwenden (z. B. images/flipbooks-geschuetzt). Mit dieser Option darf der Ordner auch ein absoluter Pfad außerhalb des Web-Verzeichnisses sein (z. B. /home/benutzer/kataloge) – empfohlen auf nginx-Servern, die .htaccess ignorieren."
MOD_PDFFLIPBOOK_WARNING_HTACCESS_WRITE="PDF Flipbook Catalogs: Der Ordner <code>%s</code> konnte nicht geschützt werden, weil die Datei .htaccess nicht angelegt werden konnte. Die PDFs sind weiterhin über direkte Links erreichbar. Bitte die Schreibrechte prüfen. (Nur für Administratoren sichtbar.)"
MOD_PDFFLIPBOOK_WARNING_HTACCESS_FOREIGN="PDF Flipbook Catalogs: Im Ordner <code>%s</code> liegt bereits eine .htaccess, die nicht von diesem Modul stammt. Sie wurde nicht verändert. Bitte prüfen, ob sie den direkten Zugriff sperrt (Require all denied). (Nur für Administratoren sichtbar.)"
MOD_PDFFLIPBOOK_WARNING_SERVER="PDF Flipbook Catalogs: Dieser Webserver ignoriert vermutlich .htaccess-Dateien, die PDFs in <code>%s</code> könnten also weiterhin über direkte Links erreichbar sein. Den Ordner außerhalb des Web-Verzeichnisses ablegen und den absoluten Pfad eintragen. (Nur für Administratoren sichtbar.)"
MOD_PDFFLIPBOOK_WARNING_PUBLIC="PDF Flipbook Catalogs: „Dateien schützen“ ist eingeschaltet, die Zugriffsebene des Moduls ist aber „Öffentlich“ – damit kann jeder die PDFs öffnen. Die Zugriffsebene auf „Registriert“ oder eine eigene Gruppe stellen. (Nur für Administratoren sichtbar.)"
