MOD_PDFFLIPBOOK_FIELD_OVERRIDES_LABEL="Settings per file"
MOD_PDFFLIPBOOK_FIELD_OVERRIDES_DESC="Only needed if the title should differ from the file name or a catalogue should be hidden. Enter the file as 'de/filename.pdf' or just 'filename.pdf'."
MOD_PDFFLIPBOOK_FIELD_OV_FILE_LABEL="File"
MOD_PDFFLIPBOOK_FIELD_OV_TITLE_LABEL="Displayed title"
MOD_PDFFLIPBOOK_FIELD_OV_DESC_LABEL="Description"
MOD_PDFFLIPBOOK_FIELD_OV_HIDE_LABEL="Hide"

MOD_PDFFLIPBOOK_FIELDSET_VIEWER="Flipbook & thumbnail"
MOD_PDFFLIPBOOK_FIELD_VIEWER_LABEL="Viewer address"
MOD_PDFFLIPBOOK_FIELD_VIEWER_DESC="Leave empty to use the built-in viewer. Only needed if you run the viewer in another place: relative to the Joomla root (e.g. flipbook/) or a full URL."
MOD_PDFFLIPBOOK_FIELD_THUMBWIDTH_LABEL="Thumbnail width (px)"
MOD_PDFFLIPBOOK_FIELD_THUMBWIDTH_DESC="Displayed width. The image is generated at double resolution for sharp display on retina screens."

MOD_PDFFLIPBOOK_FIELD_OV_DESC_HINT="Short description shown below the title"
MOD_PDFFLIPBOOK_FIELD_VIEWER_HINT="Built-in viewer"

MOD_PDFFLIPBOOK_FIELDSET_APPEARANCE="Appearance"
MOD_PDFFLIPBOOK_FIELD_ACCENT_LABEL="Accent colour"
MOD_PDFFLIPBOOK_FIELD_ACCENT_DESC="Buttons, highlights and the line below the toolbar in the viewer; thumbnail border and buttons in the module. The hover colour is calculated automatically."
MOD_PDFFLIPBOOK_FIELD_BARBG_LABEL="Toolbar background"
MOD_PDFFLIPBOOK_FIELD_BARBG_DESC="Background colour of the viewer's toolbar."
MOD_PDFFLIPBOOK_FIELD_BARFG_LABEL="Toolbar text and icons"
MOD_PDFFLIPBOOK_FIELD_BARFG_DESC="Colour of the icons and the text in the toolbar. Choose a colour with good contrast to the toolbar background."
MOD_PDFFLIPBOOK_FIELD_STAGEBG_LABEL="Page background"
MOD_PDFFLIPBOOK_FIELD_STAGEBG_DESC="Background behind the pages of the flipbook."
MOD_PDFFLIPBOOK_FIELD_COLORMODULE_LABEL="Use accent colour in the module"
MOD_PDFFLIPBOOK_FIELD_COLORMODULE_DESC="Uses the accent colour for the thumbnail border and the buttons of the module. Switch off to style the module completely with your template CSS (variables --pfb-accent and --pfb-accent-dark)."
MOD_PDFFLIPBOOK_FIELD_FLIP_LABEL="Flip duration (ms)"
MOD_PDFFLIPBOOK_FIELD_FLIP_DESC="Duration of the page flip animation in milliseconds (100–3000, default 800)."
MOD_PDFFLIPBOOK_NOTICE_NO_FOLDER="PDF Flipbook Catalogs: The folder <code>%s</code> does not exist. Please check the setting “Catalogue folder”. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_NOTICE_NO_FILES="PDF Flipbook Catalogs: No PDF files found in <code>%s</code>. The module is designed for multilingual sites: create one subfolder per language (e.g. <code>de</code>, <code>en</code>) and put the PDFs there. On a single-language site you can put the PDFs directly into the folder, as long as it has no language subfolders. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_FIELD_PROTECT_LABEL="Protect files"
MOD_PDFFLIPBOOK_FIELD_PROTECT_DESC="Only visitors who are allowed to see this module (tab “Module” → Access, e.g. “Registered”) can open the PDFs. Direct links to the files no longer work: the module blocks the folder with a .htaccess file and Joomla delivers the PDFs and thumbnails itself after checking the access level. Use a separate folder for protected catalogues (e.g. images/flipbooks-protected). With this option the folder may also be an absolute path outside the web root (e.g. /home/user/catalogues) – recommended on nginx servers, which ignore .htaccess."
MOD_PDFFLIPBOOK_WARNING_HTACCESS_WRITE="PDF Flipbook Catalogs: The folder <code>%s</code> could not be protected because the file .htaccess could not be created. The PDFs can still be opened via direct links. Please check the write permissions. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_WARNING_HTACCESS_FOREIGN="PDF Flipbook Catalogs: The folder <code>%s</code> already contains a .htaccess file that was not created by this module, so it was left unchanged. Please make sure that it blocks direct access (Require all denied). (Only visible to administrators.)"
MOD_PDFFLIPBOOK_WARNING_SERVER="PDF Flipbook Catalogs: This web server probably ignores .htaccess files, so the PDFs in <code>%s</code> may still be reachable via direct links. Move the folder outside the web root and enter its absolute path. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_WARNING_PUBLIC="PDF Flipbook Catalogs: “Protect files” is enabled, but the module’s access level is “Public”, so everybody can open the PDFs. Set the access level to “Registered” or a special group. (Only visible to administrators.)"

