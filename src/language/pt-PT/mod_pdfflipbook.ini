MOD_PDFFLIPBOOK_NOTICE_NO_FOLDER="PDF Flipbook Catalogs: The folder <code>%s</code> does not exist. Please check the setting “Catalogue folder”. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_NOTICE_NO_FILES="PDF Flipbook Catalogs: No PDF files found in <code>%s</code>. The module is designed for multilingual sites: create one subfolder per language (e.g. <code>de</code>, <code>en</code>) and put the PDFs there. On a single-language site you can put the PDFs directly into the folder, as long as it has no language subfolders. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_WARNING_HTACCESS_WRITE="PDF Flipbook Catalogs: The folder <code>%s</code> could not be protected because the file .htaccess could not be created. The PDFs can still be opened via direct links. Please check the write permissions. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_WARNING_HTACCESS_FOREIGN="PDF Flipbook Catalogs: The folder <code>%s</code> already contains a .htaccess file that was not created by this module, so it was left unchanged. Please make sure that it blocks direct access (Require all denied). (Only visible to administrators.)"
MOD_PDFFLIPBOOK_WARNING_SERVER="PDF Flipbook Catalogs: This web server probably ignores .htaccess files, so the PDFs in <code>%s</code> may still be reachable via direct links. Move the folder outside the web root and enter its absolute path. (Only visible to administrators.)"
MOD_PDFFLIPBOOK_WARNING_PUBLIC="PDF Flipbook Catalogs: “Protect files” is enabled, but the module’s access level is “Public”, so everybody can open the PDFs. Set the access level to “Registered” or a special group. (Only visible to administrators.)"
