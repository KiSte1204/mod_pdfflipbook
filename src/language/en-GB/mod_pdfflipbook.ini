MOD_PDFFLIPBOOK="PDF Flipbook Catalogs"
MOD_PDFFLIPBOOK_XML_DESCRIPTION="Lists the PDF catalogues of the current language with a cover thumbnail and opens them in the built-in flipbook viewer (PDF.js, no external services)."
MOD_PDFFLIPBOOK_INTRO="Here you will find our current catalogues and flyers as interactive flipbooks:"
MOD_PDFFLIPBOOK_DOWNLOAD="Download PDF"
MOD_PDFFLIPBOOK_COL_TITLE="Document"
MOD_PDFFLIPBOOK_COL_SIZE="Size"
MOD_PDFFLIPBOOK_COL_DATE="Date"
MOD_PDFFLIPBOOK_COL_ACTIONS="Actions"
MOD_PDFFLIPBOOK_OPEN="Browse"
MOD_PDFFLIPBOOK_DOWNLOAD_SHORT="Download"

MOD_PDFFLIPBOOK_FIELD_FOLDER_LABEL="Catalogue folder"
MOD_PDFFLIPBOOK_FIELD_FOLDER_DESC="Folder relative to the Joomla root. Multilingual sites: one subfolder per language named with the two-letter code (de, en, fr …) containing the PDFs. Single-language sites: PDFs directly in this folder (without language subfolders). Case-sensitive. If Joomla runs in a subfolder, a public folder next to it can be used as well, e.g. ../documents/magazine (not for protected catalogues)."
MOD_PDFFLIPBOOK_FIELD_GROUPS_LABEL="Subfolders"
MOD_PDFFLIPBOOK_FIELD_GROUPS_DESC="“Language folders”: one subfolder per language (de, en …), the files follow the page language. “Folders as groups”: every subfolder becomes a group with the folder name as heading, e.g. 2026, 2025 or 2021-2025. On multilingual sites these folders are placed inside the language folder (e.g. en/2026), otherwise directly in the catalogue folder. PDFs directly in the folder are shown at the top without heading."
MOD_PDFFLIPBOOK_GROUPS_LANG="Language folders"
MOD_PDFFLIPBOOK_GROUPS_FOLDERS="Folders as groups (folder name as heading)"
MOD_PDFFLIPBOOK_FIELD_GROUPSORT_LABEL="Folder order"
MOD_PDFFLIPBOOK_FIELD_GROUPSORT_DESC="Sorts the folders by name. “Descending” shows the newest year first for year folders."
MOD_PDFFLIPBOOK_GROUPSORT_DESC="Name descending (2026, 2025 …)"
MOD_PDFFLIPBOOK_GROUPSORT_ASC="Name ascending (2025, 2026 …)"
MOD_PDFFLIPBOOK_FIELD_COLLAPSE_LABEL="Collapsible groups"
MOD_PDFFLIPBOOK_FIELD_COLLAPSE_DESC="Groups with a heading (folders or languages) can be expanded and collapsed – useful for many files, so the page is not too long on first load."
MOD_PDFFLIPBOOK_COLLAPSE_NONE="No, all open"
MOD_PDFFLIPBOOK_COLLAPSE_FIRST="Yes, first group open"
MOD_PDFFLIPBOOK_COLLAPSE_ALL="Yes, all collapsed"
MOD_PDFFLIPBOOK_FIELD_SHOWSIZE_LABEL="Column “Size”"
MOD_PDFFLIPBOOK_FIELD_SHOWSIZE_DESC="Downloads layout only: show the file size."
MOD_PDFFLIPBOOK_FIELD_SHOWDATE_LABEL="Column “Date”"
MOD_PDFFLIPBOOK_FIELD_SHOWDATE_DESC="Downloads layout only: show the file date (last upload). Hide it if the date is already part of the file name."
MOD_PDFFLIPBOOK_FIELD_TITLEMODE_LABEL="Title from file name"
MOD_PDFFLIPBOOK_FIELD_TITLEMODE_DESC="How the displayed title is built from the file name when no custom title is set below. “Cleaned up” removes a number at the start (10_ or 20260830-) and the language code and replaces underscores with spaces. “Complete file name” shows the name unchanged, e.g. when the date at the start matters."
MOD_PDFFLIPBOOK_TITLEMODE_CLEAN="Cleaned up (10_Lights_EN.pdf → Lights)"
MOD_PDFFLIPBOOK_TITLEMODE_NAME="Complete file name without .pdf"
MOD_PDFFLIPBOOK_TITLEMODE_FILE="Complete file name with .pdf"
MOD_PDFFLIPBOOK_FIELD_SCOPE_LABEL="Languages"
MOD_PDFFLIPBOOK_FIELD_SCOPE_DESC="“Current language” shows the catalogues of the page language (with fallback). “All languages” shows all language folders, current language first – e.g. for an overview page with the “Downloads” layout."
MOD_PDFFLIPBOOK_SCOPE_CURRENT="Current language"
MOD_PDFFLIPBOOK_SCOPE_ALL="All languages"
MOD_PDFFLIPBOOK_FIELD_FALLBACK_LABEL="Fallback language"
MOD_PDFFLIPBOOK_FIELD_FALLBACK_DESC="If there is no folder or no PDF for the page language, the catalogues of this language are shown."
MOD_PDFFLIPBOOK_FIELD_SHOWINTRO_LABEL="Show intro text"
MOD_PDFFLIPBOOK_FIELD_SHOWINTRO_DESC="Shows an intro text above the catalogues in the page language."
MOD_PDFFLIPBOOK_FIELD_INTRO_LABEL="Intro text"
MOD_PDFFLIPBOOK_FIELD_INTRO_DESC="Leave empty = default text of the page language. A custom text applies to all languages (HTML allowed)."
MOD_PDFFLIPBOOK_FIELD_DOWNLOAD_LABEL="Show download link"
MOD_PDFFLIPBOOK_FIELD_DOWNLOAD_DESC="Shows a direct PDF download link with file size below each catalogue."
MOD_PDFFLIPBOOK_FIELD_TARGET_LABEL="Open catalogue in"
MOD_PDFFLIPBOOK_TARGET_BLANK="New tab"
MOD_PDFFLIPBOOK_TARGET_SELF="Same tab"

