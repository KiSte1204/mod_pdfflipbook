<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PDF Flipbook Catalogs icon – (C) 2026 Stefan Kirchhoff, webkiste.net -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f0"/>
      <stop offset="1" stop-color="#1f56b8"/>
    </linearGradient>
    <linearGradient id="curl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdcf3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- left page -->
  <path d="M256 150 C 214 128, 156 120, 104 128 L 104 372 C 156 364, 214 372, 256 394 Z" fill="#ffffff"/>
  <!-- right page with lifted corner -->
  <path d="M256 150 C 298 128, 356 120, 408 128 L 408 300 L 340 374 C 306 376, 278 382, 256 394 Z" fill="#eef3fc"/>
  <!-- page curl -->
  <path d="M408 300 L 340 374 C 344 340, 366 312, 408 300 Z" fill="url(#curl)" stroke="#1f56b8" stroke-opacity="0.18" stroke-width="2"/>
  <!-- spine -->
  <path d="M256 150 L 256 394" stroke="#1f56b8" stroke-opacity="0.35" stroke-width="4"/>
  <!-- text lines -->
  <g stroke="#2a6fdb" stroke-width="12" stroke-linecap="round" opacity="0.55">
    <path d="M138 182 L 222 192"/><path d="M138 222 L 222 230"/><path d="M138 262 L 206 268"/>
    <path d="M290 192 L 374 182"/><path d="M290 230 L 374 222"/><path d="M290 268 L 352 262"/>
  </g>
  <!-- image block on left page -->
  <rect x="138" y="296" width="84" height="48" rx="8" fill="#2a6fdb" opacity="0.25"/>
  <!-- flip arrow -->
  <path d="M168 436 C 220 462, 292 462, 344 436" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <path d="M326 416 L 352 432 L 332 456" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
